name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  video-sync-api:
    runs-on: ubuntu-latest
    # 勿用 secrets 做 if（GitHub 会恒为假）；无 Token 时脚本自行跳过
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy video sync Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_SUBDOMAIN: ${{ vars.CLOUDFLARE_ACCOUNT_SUBDOMAIN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: bash scripts/deploy-video-sync.sh

  build:
    runs-on: ubuntu-latest
    needs: video-sync-api
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install deps and build (Astro SSG)
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
          VIDEO_SYNC_API_URL: ${{ needs.video-sync-api.outputs.api_url || vars.VIDEO_SYNC_API_URL || '' }}
          UPLOADCARE_PUBLIC_KEY: ${{ vars.UPLOADCARE_PUBLIC_KEY || secrets.UPLOADCARE_PUBLIC_KEY || '' }}
        run: ASTRO_TELEMETRY_DISABLED=1 npm ci && npm run build

      - name: Check dist artifacts
        run: test -f dist/index.html && test -f dist/search-index.json && test -f dist/ai-news.json

      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: ${{ steps.setup-python.outputs.python-path }} -m pip install -r requirements.txt

      - name: Validate dist
        run: DIST=dist ${{ steps.setup-python.outputs.python-path }} scripts/validate_ci.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
